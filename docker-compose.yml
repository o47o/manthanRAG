# Manthan RAG — customer install (docker compose up -d).
#
# Only the API is published. Redis (and Neo4j, when the "graph" profile is on) stay on the
# private network. Configuration: backend/.env (see backend/.env.example).
#
#   docker compose run --rm migrate          # create / upgrade the database schema
#   docker compose up -d                     # API + worker + redis + admin console
#   docker compose --profile graph up -d     # also Neo4j for GraphRAG (set NEO4J_ENABLED=true)

name: manthan-rag

x-app: &app
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: manthan-rag:latest
  env_file:
    - ./backend/.env
  environment:
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  restart: unless-stopped
  networks: [rag]
  volumes:
    - models:/models                       # embedding model + reranker (HF cache)
    - docling_models:/app/docling_models   # docling layout / table weights
    - storage:/app/local_storage           # files, when no Supabase Storage is configured

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [rag]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: ["python", "scripts/migrate.py"]

  # One-time model download into the volumes (needs internet once; the services run offline).
  models:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    environment:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    command: ["python", "scripts/download_models.py"]

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  worker:
    <<: *app
    command: ["celery", "-A", "app.core.background_tasks", "worker", "--loglevel=info",
              "-Q", "ingestion,parse,embed,graph", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.background_tasks inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 180s

  admin-ui:
    build:
      context: ./admin-ui
      args:
        API_URL: http://api:8000
    image: manthan-rag-admin:latest
    restart: unless-stopped
    networks: [rag]
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    restart: unless-stopped
    networks: [rag]
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
    volumes:
      - neo4j_data:/data

networks:
  rag:

volumes:
  models:
  docling_models:
  storage:
  redis_data:
  neo4j_data:
